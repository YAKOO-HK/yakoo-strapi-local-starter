packages:
  - "apps/*"
  - "packages/*"
publicHoistPattern:
  - "sharp"
  - "@types/*"
  - "!@types/react"
  - "!@types/react-dom"
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  aws-sdk: true
  core-js-pure: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
